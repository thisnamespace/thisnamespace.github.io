name: CI

on:
  push:
    branches: [main, development, claude/director-site]
  pull_request:

# Read-only: nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  checks:
    name: Checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to exact commits; the comment gives the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Known vulnerabilities in what runs on the site
        run: bun audit --omit=dev --audit-level=high
      - run: bun run type-check
      - run: bun run lint
      - run: bun run test:unit
      - name: Install Chrome for the browser tests
        run: bunx playwright install --with-deps chromium
      # Builds the production site and tests that, on a desktop and a phone-sized screen.
      - run: bunx playwright test --project=chromium --project="Mobile Chrome"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  other-browsers:
    name: Firefox and Safari (does not block)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # These have not been run before, so a failure here is information, not a blocker.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps firefox webkit
      - run: bunx playwright test --project=firefox --project=webkit --project="Mobile Safari"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-other-browsers
          path: playwright-report/
          retention-days: 7
