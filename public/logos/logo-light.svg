<svg viewBox="60 60 280 310" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#f8fafc"/>

  <!-- Globe wireframe (representing 3 continents) -->
  <g opacity="0.2" stroke="#94a3b8" stroke-width="1.5" fill="none">
    <circle cx="200" cy="200" r="120"/>
    <ellipse cx="200" cy="200" rx="120" ry="60"/>
    <ellipse cx="200" cy="200" rx="60" ry="120"/>
    <line x1="80" y1="200" x2="320" y2="200"/>
    <path d="M 200 80 Q 240 140 200 200 T 200 320" stroke="#94a3b8"/>
  </g>

  <!-- Main code brackets with namespace styling -->
  <g transform="translate(200, 200)">
    <!-- Left bracket -->
    <path d="M -80 -60 L -100 -60 L -100 60 L -80 60"
          stroke="#0891b2"
          stroke-width="6"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- Right bracket -->
    <path d="M 80 -60 L 100 -60 L 100 60 L 80 60"
          stroke="#0891b2"
          stroke-width="6"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    </path>

    <!-- Center dots representing "this" - styled like code -->
    <g fill="#d97706">
      <circle cx="-30" cy="-20" r="5"/>
      <circle cx="0" cy="-20" r="5"/>
      <circle cx="30" cy="-20" r="5"/>
    </g>

    <!-- Namespace double colon -->
    <g fill="#059669">
      <circle cx="-10" cy="10" r="6"/>
      <circle cx="10" cy="10" r="6"/>
    </g>

    <!-- Airplane path showing travel (simplified) -->
    <path d="M -70 30 L -40 40 L 40 -10 L 70 -20"
          stroke="#7c3aed"
          stroke-width="2"
          fill="none"
          stroke-dasharray="4 4"
          opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="0" to="-8" dur="1s" repeatCount="indefinite"/>
    </path>

    <!-- Small airplane icon -->
    <g transform="translate(70, -20) rotate(-25)">
      <path d="M 0 0 L -3 -8 L 0 -6 L 3 -8 Z M 0 -2 L -6 0 L 6 0"
            fill="#7c3aed"
            opacity="0.9"/>
    </g>
  </g>

  <!-- Text -->
  <text x="200" y="320"
        font-family="'Courier New', monospace"
        font-size="24"
        font-weight="bold"
        fill="#0f172a"
        text-anchor="middle">
    thisnamespace
  </text>

  <text x="200" y="345"
        font-family="'Courier New', monospace"
        font-size="12"
        fill="#475569"
        text-anchor="middle"
        letter-spacing="2">
    MICHAEL
  </text>

  <!-- Accent dots in corners (representing continents) -->
  <g fill="#0891b2" opacity="0.4">
    <circle cx="50" cy="50" r="4"/>
    <circle cx="350" cy="100" r="4"/>
    <circle cx="300" cy="350" r="4"/>
  </g>
</svg>
